name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/yt

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: macos-13
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Build standalone binary
        run: uv run python build.py

      - name: Smoke test the binary (unix)
        if: runner.os != 'Windows'
        run: ./dist/yt-* --version

      - name: Smoke test the binary (windows)
        if: runner.os == 'Windows'
        run: Get-ChildItem dist/yt-*.exe | ForEach-Object { & $_.FullName --version }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-${{ matrix.label }}
          path: apps/yt/dist/yt-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/yt-*
            apps/yt/completions/yt.bash
            apps/yt/completions/yt.zsh
            apps/yt/completions/yt.fish
            apps/yt/completions/yt.ps1
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
