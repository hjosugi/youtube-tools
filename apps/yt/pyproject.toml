[project]
name = "yt-tools"
version = "1.1.1"
description = "YouTube subtitles, MP3 and MP4 in one click: a local web UI and a CLI"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.11,<3.16"
dependencies = [
    "yt-dlp[curl-cffi,default]>=2026.11.23",
    "certifi>=2026.7.22",
]

[project.scripts]
yt = "ytcli.ui.cli:main"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytcli"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
