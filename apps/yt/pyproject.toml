[project]
name = "yt-tools"
version = "1.0.0"
description = "One cross-platform CLI and GUI for YouTube audio, video and subtitles"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.11,<3.16"
dependencies = [
    "yt-dlp>=2026.8.19",
    "certifi>=2026.7.22",
]

[project.scripts]
yt = "ytcli.ui.cli:main"

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytcli"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.bumpversion]
current_version = "1.0.0"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "ytcli/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
